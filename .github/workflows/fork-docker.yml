# Fork-only workflow: builds a Komga Docker image and pushes it to
# ghcr.io/<owner>/komga. It does not run on the upstream repository.
name: Fork Docker image

on:
  push:
    branches:
      - sk-main
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (comma separated)'
        default: 'linux/arm64'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: github.repository_owner != 'gotson'
    # Native arm64 runner (free for public repos): no emulation for the default platform.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: WebUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build jar
        run: ./gradlew :komga:webuiCopyIndex :komga:nextuiCopyIndex :komga:bootJar

      # Reuse the upstream JReleaser Dockerfile template. Render it by hand:
      # the template expects the jar in "assembly/" and a placeholder for its name.
      - name: Prepare Docker context
        run: |
          mkdir -p build/docker-ctx/assembly
          JAR=$(ls komga/build/libs/komga-*.jar | grep -v -- '-plain' | head -n1)
          cp "$JAR" build/docker-ctx/assembly/
          sed -e "s|{{distributionArtifactFile}}|$(basename "$JAR")|" \
              -e "s|https://github.com/gotson/komga|https://github.com/${GITHUB_REPOSITORY}|" \
              komga/docker/Dockerfile.tpl > build/docker-ctx/Dockerfile
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/komga" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: build/docker-ctx
          platforms: ${{ inputs.platforms || 'linux/arm64' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
